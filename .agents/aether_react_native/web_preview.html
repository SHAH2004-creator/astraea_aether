<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>National Urban Crisis Observatory</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      safelist: [
        'text-cyan-400', 'text-amber-500', 'text-red-500', 'text-emerald-400',
        'border-cyan-400', 'border-amber-500', 'border-red-500', 'border-emerald-400',
        'bg-cyan-400', 'bg-amber-500', 'bg-red-500', 'bg-emerald-400',
        'from-cyan-400', 'from-amber-500', 'from-red-500'
      ],
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Arial', 'sans-serif'],
          },
          colors: {
            cyanTheme: '#06b6d4',
            amberTheme: '#d97706',
            redTheme: '#ef4444',
            stateGreen: '#00501F'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', Arial, sans-serif; margin: 0; padding: 0; overflow: hidden; }
    .corporate-card {
      background: #1e293b;
      border: 4px solid #334155;
      border-radius: 12px;
    }
    .pulsate { animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    /* Highly readable radial progress */
    .radial-progress {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 6px solid #334155;
    }
    .radial-progress::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: #1e293b;
      z-index: 1;
    }
    .radial-content { z-index: 2; text-align: center; }
  </style>
</head>
<body>
  <div id="root" class="h-screen w-screen flex flex-col bg-[#0f172a] text-slate-100"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [stateData, setStateData] = useState(null);
      const [offline, setOffline] = useState(true);
      
      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const dataPoints = useRef({ time: [], psi: [], power: [] });

      // Clean Accessible Dynamic Color Setup
      let theme = 'cyanTheme';
      let themeColorHex = '#06b6d4';
      if (stateData) {
        if (stateData.siege_mode_active) { theme = 'redTheme'; themeColorHex = '#ef4444'; }
        else if (stateData.ssi < 0.5) { theme = 'amberTheme'; themeColorHex = '#d97706'; }
      }

      const getThemeClass = (type) => {
        if (type === 'text') return `text-${theme}`;
        if (type === 'border') return `border-${theme}`;
        if (type === 'bg') return `bg-${theme}`;
        return '';
      };

      // Interval Synchronization
      useEffect(() => {
        const fetchData = async () => {
          try {
            const stateRes = await fetch('http://127.0.0.1:8080/state');
            if (stateRes.ok) {
              const state = await stateRes.json();
              setStateData(state);
              setOffline(false);
              updateChart(state);
            } else {
              setOffline(true);
            }
          } catch (error) {
            setOffline(true);
          }
        };

        fetchData();
        const interval = setInterval(fetchData, 1500);
        return () => clearInterval(interval);
      }, []);

      // High-Contrast Thicker Chart.js Initialization
      useEffect(() => {
        if (chartRef.current && !chartInstance.current) {
          const ctx = chartRef.current.getContext('2d');
          
          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: dataPoints.current.time,
              datasets: [
                { 
                  label: 'Water Flow Volume (PSI)', 
                  data: dataPoints.current.psi, 
                  borderColor: '#06b6d4', 
                  backgroundColor: 'rgba(6, 182, 212, 0.1)',
                  fill: true,
                  tension: 0.2, 
                  borderWidth: 4 // Thicker stroke for maximum legibility
                },
                { 
                  label: 'Power Grid Load (%)', 
                  data: dataPoints.current.power, 
                  borderColor: '#f8fafc', 
                  borderDash: [8, 4], 
                  tension: 0.2, 
                  borderWidth: 3 // High legibility power grid line
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: { duration: 400 },
              scales: {
                x: { display: false },
                y: { 
                  grid: { color: 'rgba(255, 255, 255, 0.1)', lineWidth: 1.5 }, 
                  ticks: { color: '#cbd5e1', font: { size: 14, weight: 'bold' } },
                  min: 0, 
                  max: 100 
                }
              },
              plugins: { 
                legend: { 
                  labels: { 
                    color: '#f8fafc', 
                    font: { size: 14, weight: 'bold', family: 'Inter' } 
                  } 
                }
              }
            }
          });
        }
      }, []);

      const updateChart = (state) => {
        if (!chartInstance.current) return;
        
        let cHex = '#06b6d4';
        let bgHex = 'rgba(6, 182, 212, 0.1)';
        
        if (state.siege_mode_active) {
          cHex = '#ef4444';
          bgHex = 'rgba(239, 68, 68, 0.15)';
        } else if (state.ssi < 0.5) {
          cHex = '#d97706';
          bgHex = 'rgba(217, 119, 6, 0.15)';
        }

        const now = new Date().toLocaleTimeString();
        const jitter = (Math.random() - 0.5) * 4;
        let newPsi = state.ssi * 100 + jitter;
        let newPower = state.ssi * 92 + jitter;
        
        if (state.ssi < 0.5) {
            newPsi = 28 + jitter;
            newPower = 32 + jitter;
        }

        const pts = dataPoints.current;
        pts.time.push(now);
        pts.psi.push(newPsi);
        pts.power.push(newPower);

        if (pts.time.length > 12) {
          pts.time.shift();
          pts.psi.shift();
          pts.power.shift();
        }

        chartInstance.current.data.datasets[0].borderColor = cHex;
        chartInstance.current.data.datasets[0].backgroundColor = bgHex;
        chartInstance.current.update();
      };

      // Simulator Actions
      const simulateBurst = async () => {
        try { await fetch('http://127.0.0.1:8080/api/override/alert', { method: 'POST' }); } catch (e) {}
      };
      const simulatePanic = async () => {
        try { 
            await fetch('http://127.0.0.1:8080/api/traffic/reroute', { method: 'POST' });
            await fetch('http://127.0.0.1:8080/api/grid/isolate', { method: 'POST' });
        } catch (e) {}
      };
      const triggerReset = async () => {
        try { await fetch('http://127.0.0.1:8080/api/override/lazarus', { method: 'POST' }); } catch (e) {}
      };

      if (offline || !stateData) {
        return (
          <div className="flex flex-col items-center justify-center h-full w-full bg-[#0f172a] text-center">
            <h1 className="text-4xl font-bold text-slate-500 tracking-wider">AWAITING CONNECTION</h1>
            <p className="text-slate-600 mt-4 text-xl">Connecting to Government Systems Gateway...</p>
          </div>
        );
      }

      const { ssi, social_signal, weather_condition } = stateData;
      const ssiDegree = Math.round(ssi * 360);
      const radialStyle = { background: `conic-gradient(${themeColorHex} ${ssiDegree}deg, #334155 0deg)` };

      // Solid, Accessible Boomer-Friendly Badges
      let systemStatusLabel = "🟢 ROUTINE / SAFE";
      let systemStatusBg = "bg-emerald-600 text-white";
      
      if (theme === 'amberTheme') {
        systemStatusLabel = "🟡 WARNING UNDER REVIEW";
        systemStatusBg = "bg-amber-600 text-white";
      } else if (theme === 'redTheme') {
        systemStatusLabel = "🔴 CRITICAL LOCKDOWN";
        systemStatusBg = "bg-red-600 text-white animate-pulse";
      }

      // City Sectors
      const getSectorBadge = (sector) => {
          if (theme === 'cyanTheme') return { label: "🟢 SAFE", color: "bg-emerald-600" };
          if (theme === 'amberTheme') {
              if (sector === 'downtown' || sector === 'industrial') return { label: "🟡 RISK DETECTED", color: "bg-amber-600 animate-pulse" };
              return { label: "🟢 SAFE", color: "bg-emerald-600" };
          }
          if (theme === 'redTheme') {
              if (sector === 'downtown' || sector === 'industrial') return { label: "🔴 SECTOR LOCKED", color: "bg-red-600 pulsate" };
              if (sector === 'residential') return { label: "🟡 DEGRADED", color: "bg-amber-600" };
              return { label: "🟢 SAFE (STANDBY)", color: "bg-emerald-600" }; // Hospital is shielded
          }
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#0f172a] relative transition-colors duration-500 overflow-hidden">
          
          {/* Header with Pakistan Flag & Institutional Branding */}
          <header className="w-full flex flex-col justify-center items-center border-b-4 border-slate-700 z-10 bg-slate-900 shadow-md shrink-0">
            <div className="w-full max-w-[1800px] flex items-center justify-between p-5 px-10">
              
              {/* Pakistan Flag SVG + Clean Title */}
              <div className="flex items-center">
                <svg className="mr-5 rounded-lg border-2 border-slate-600 shadow-md shrink-0" width="75" height="50" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
                  <rect width="300" height="200" fill="#00501F" />
                  <rect width="75" height="200" fill="#FFFFFF" />
                  <circle cx="180" cy="100" r="45" fill="#FFFFFF" />
                  <circle cx="196" cy="84" r="45" fill="#00501F" />
                  <polygon points="180,68 184,77 194,77 186,83 189,92 180,86 171,92 174,83 166,77 176,77" fill="#FFFFFF" transform="rotate(-35 180 80)" />
                </svg>
                <div className="flex flex-col">
                  <span className="text-3xl font-extrabold tracking-wide text-slate-100 uppercase font-sans">
                    NATIONAL URBAN CRISIS OBSERVATORY
                  </span>
                  <span className="text-sm font-semibold text-emerald-400 tracking-[0.2em] font-sans">
                    GOVERNMENT OF PAKISTAN — AETHER PLATFORM
                  </span>
                </div>
              </div>

              {/* Massive Unmistakable System State Badge */}
              <div className={`px-6 py-3 rounded-xl ${systemStatusBg} font-extrabold text-2xl tracking-wider shadow-lg border-2 border-white/20`}>
                {systemStatusLabel}
              </div>

            </div>
          </header>

          {/* Main 3-Column Layout (Boomer-Friendly, Enlarged Layout) */}
          <main className="flex-1 w-full max-w-[1800px] mx-auto flex flex-row p-8 gap-8 z-10 min-h-0 pb-36">
            
            {/* COLUMN 1: Live Field Reports */}
            <section className="flex-[0.8] flex flex-col corporate-card p-6 overflow-hidden shadow-xl">
              <h2 className="text-2xl font-black mb-6 border-b-2 border-slate-700 pb-3 text-slate-200 uppercase font-sans">
                LIVE FIELD REPORTS
              </h2>
              <div className="flex-1 overflow-y-auto pr-2 space-y-5 font-sans">
                <div className="p-5 bg-slate-900 border-2 border-slate-700 rounded-lg">
                  <span className="text-sm font-extrabold text-slate-400 tracking-wider uppercase block mb-2">PUBLIC REPORT FEED</span>
                  <p className="text-lg text-slate-100 leading-snug">{social_signal}</p>
                </div>
                <div className="p-5 bg-slate-900 border-2 border-slate-700 rounded-lg">
                  <span className="text-sm font-extrabold text-slate-400 tracking-wider uppercase block mb-2">INFRASTRUCTURE SENSORS</span>
                  <p className="text-lg text-slate-100 leading-snug">{weather_condition}</p>
                </div>
              </div>
            </section>

            {/* COLUMN 2: Central Vital Signs & Overall Safety Score */}
            <section className="flex-[1.8] flex flex-col corporate-card p-6 shadow-xl relative overflow-hidden">
              <h2 className="text-2xl font-black mb-6 border-b-2 border-slate-700 pb-3 text-slate-200 uppercase font-sans">
                VITAL INFRASTRUCTURE INDICATORS
              </h2>
              
              <div className="flex flex-row flex-1 mt-4 gap-10 items-center justify-center h-full">
                
                {/* Score Column */}
                <div className="flex flex-col items-center justify-center shrink-0">
                  <div className="radial-progress shadow-2xl" style={radialStyle}>
                    <div className="radial-content flex flex-col items-center">
                      <span className="text-6xl font-black text-white">{Math.round(ssi * 100)}%</span>
                      <span className="text-[11px] font-black tracking-widest mt-2 text-slate-300 uppercase max-w-[120px] leading-tight">
                        OVERALL CITY SAFETY SCORE
                      </span>
                    </div>
                  </div>
                  
                  <div className="mt-6 text-center">
                    <span className="text-xs font-extrabold tracking-widest text-slate-400 uppercase block mb-1">
                      DECISION MAKER LOGIC GATE
                    </span>
                    <span className="text-lg font-black text-slate-200">
                      {theme === 'cyanTheme' && "AI WORKFORCE VOTING STATUS: STABLE"}
                      {theme === 'amberTheme' && "AI WORKFORCE VOTING STATUS: DISCREPANCY REQ. VOTE"}
                      {theme === 'redTheme' && "AI WORKFORCE VOTING STATUS: EMERGENCY AUTONOMOUS LOCKDOWN"}
                    </span>
                  </div>
                </div>
                
                {/* Thicker Accessible Wave Graph */}
                <div className="flex-1 h-full min-h-[250px] w-full bg-slate-900 rounded-lg border-2 border-slate-700 p-4 relative">
                  
                  {/* Distinct Federal Standard Sub-badge */}
                  <div className="absolute top-4 right-4 bg-emerald-950/80 border-2 border-emerald-500 text-emerald-400 text-xs font-black px-3 py-1.5 rounded-full z-20 shadow-md">
                    ✓ Operating within official Federal Standards
                  </div>
                  
                  <canvas ref={chartRef} className="relative z-10"></canvas>
                </div>

              </div>
            </section>

            {/* COLUMN 3: Predictive City Map Matrix */}
            <section className="flex-[1.2] flex flex-col corporate-card p-6 gap-5 shadow-xl">
              <h2 className="text-2xl font-black mb-4 border-b-2 border-slate-700 pb-3 text-slate-200 uppercase font-sans">
                PREDICTIVE CITY MAP MATRIX
              </h2>
              
              <div className="flex-1 grid grid-cols-2 grid-rows-2 gap-4 mt-2 font-sans">
                  
                  {/* Downtown */}
                  <div className="bg-slate-900 border-2 border-slate-700 p-5 rounded-lg flex flex-col items-center justify-center relative">
                      <span className="font-extrabold text-lg text-slate-300 mb-3 tracking-wide">DOWNTOWN</span>
                      <span className={`px-4 py-1.5 rounded-full font-black text-sm text-white ${getSectorBadge('downtown').color}`}>
                          {getSectorBadge('downtown').label}
                      </span>
                  </div>
                  
                  {/* Industrial Zone */}
                  <div className="bg-slate-900 border-2 border-slate-700 p-5 rounded-lg flex flex-col items-center justify-center relative">
                      <span className="font-extrabold text-lg text-slate-300 mb-3 tracking-wide">INDUSTRIAL ZONE</span>
                      <span className={`px-4 py-1.5 rounded-full font-black text-sm text-white ${getSectorBadge('industrial').color}`}>
                          {getSectorBadge('industrial').label}
                      </span>
                  </div>
                  
                  {/* Residential Hub */}
                  <div className="bg-slate-900 border-2 border-slate-700 p-5 rounded-lg flex flex-col items-center justify-center relative">
                      <span className="font-extrabold text-lg text-slate-300 mb-3 tracking-wide">RESIDENTIAL HUB</span>
                      <span className={`px-4 py-1.5 rounded-full font-black text-sm text-white ${getSectorBadge('residential').color}`}>
                          {getSectorBadge('residential').label}
                      </span>
                  </div>
                  
                  {/* Hospital District */}
                  <div className="bg-slate-900 border-2 border-slate-700 p-5 rounded-lg flex flex-col items-center justify-center relative">
                      <span className="font-extrabold text-lg text-slate-300 mb-3 tracking-wide">HOSPITAL DISTRICT</span>
                      <span className={`px-4 py-1.5 rounded-full font-black text-sm text-white ${getSectorBadge('hospital').color}`}>
                          {getSectorBadge('hospital').label}
                      </span>
                  </div>

              </div>
            </section>
          </main>

          {/* BOTTOM: Crisis Simulator Control Desk (Clear, Accessible Buttons) */}
          <section className="absolute bottom-0 left-0 right-0 h-32 border-t-4 border-slate-700 bg-slate-900 p-5 flex flex-col items-center justify-center z-50 shadow-2xl">
             <h3 className="text-slate-400 font-extrabold text-sm tracking-[0.2em] uppercase mb-3">
               INTERACTIVE CRISIS SIMULATION CONSOLE
             </h3>
             <div className="flex gap-8">
                <button onClick={simulateBurst} className="px-8 py-3 bg-red-700 hover:bg-red-600 text-white font-extrabold text-lg rounded-xl shadow-lg border-2 border-red-500 transition-all flex items-center transform hover:scale-105 active:scale-95">
                    🔴 SIMULATE WATER MAIN BURST
                </button>
                <button onClick={simulatePanic} className="px-8 py-3 bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-lg rounded-xl shadow-lg border-2 border-amber-400 transition-all flex items-center transform hover:scale-105 active:scale-95">
                    🟡 SIMULATE SOCIAL PANIC FEED
                </button>
                <button onClick={triggerReset} className="px-8 py-3 bg-emerald-700 hover:bg-emerald-600 text-white font-extrabold text-lg rounded-xl shadow-lg border-2 border-emerald-500 transition-all flex items-center transform hover:scale-105 active:scale-95">
                    💚 AUTOMATED EMERGENCY RESET
                </button>
             </div>
          </section>
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
