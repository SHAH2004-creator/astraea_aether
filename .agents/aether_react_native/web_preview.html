<!DOCTYPE html>
<html lang="en">
<head>

    tailwind.config = {

        'text-cyanTheme', 'text-amberTheme', 'text-redTheme', 'text-emerald-400',
        'border-cyanTheme', 'border-amberTheme', 'border-redTheme', 'border-emerald-400',
        'bg-cyanTheme', 'bg-amberTheme', 'bg-redTheme', 'bg-emerald-400',

        'border-cyan-400', 'border-amber-500', 'border-red-500', 'border-emerald-400',
        'bg-cyan-400', 'bg-amber-500', 'bg-red-500', 'bg-emerald-400',

      theme: {

            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],

  </script>
  <style>
    body { 
      background-color: #030712; 
      color: #f3f4f6; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 0; 
      overflow: hidden;
      /* Dynamic cyber grid background */
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(17, 24, 39, 0.45) 0%, rgba(3, 7, 18, 1) 100%),
        linear-gradient(rgba(31, 41, 55, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 41, 55, 0.1) 1px, transparent 1px);
      background-size: 100% 100%, 35px 35px, 35px 35px;
      position: relative;
    }
    
    /* CRT Scanner Line Overlay for premium Ops-Center immersion */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 99999;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      opacity: 0.35;
    }
    
    /* High-tech Glass panel cards */
    .tech-panel {
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.35);
      border-radius: 16px;
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .tech-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.5), transparent);
    }
    
    .tech-panel-warning::before {
      background: linear-gradient(90deg, transparent, rgba(217, 119, 6, 0.7), transparent);
    }
    
    .tech-panel-danger::before {
      background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.9), transparent);
    }
    
    .pulsate { animation: pulse 2.5s infinite ease-in-out; }
    
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    /* Highly readable glowing radial progress */
    .radial-progress {
      position: relative;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid rgba(51, 65, 85, 0.25);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 0, 0, 0.5);
      transition: all 0.5s ease;
    }
    .radial-progress::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: rgba(8, 12, 24, 0.95);
      z-index: 1;
      border: 1px solid rgba(51, 65, 85, 0.4);
    }
    .radial-content { z-index: 2; text-align: center; }

    /* React Bits TextType component CSS */
    .text-type {
      display: inline-block;
      white-space: pre-wrap;
    }
    .text-type__cursor {
      margin-left: 0.15rem;
      display: inline-block;
      opacity: 1;
      font-weight: 900;
    }
    .text-type__cursor--hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root" class="h-screen w-screen flex flex-col text-slate-100 relative"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // React Bits TextType Component ported for Standalone Babel execution
    const TextType = ({
      text,
      as: Component = 'div',
      typingSpeed = 50,
      initialDelay = 0,
      pauseDuration = 2000,
      deletingSpeed = 30,
      loop = true,
      className = '',
      showCursor = true,
      hideCursorWhileTyping = false,
      cursorCharacter = '|',
      cursorClassName = '',
      cursorBlinkDuration = 0.5,
      textColors = [],
      variableSpeed,
      onSentenceComplete,
      startOnVisible = false,
      reverseMode = false,
      ...props
    }) => {
      const [displayedText, setDisplayedText] = useState('');
      const [currentCharIndex, setCurrentCharIndex] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);
      const [currentTextIndex, setCurrentTextIndex] = useState(0);
      const [isVisible, setIsVisible] = useState(!startOnVisible);
      const cursorRef = useRef(null);
      const containerRef = useRef(null);

      const textArray = useMemo(() => (Array.isArray(text) ? text : [text]), [text]);

      const getRandomSpeed = useCallback(() => {
        if (!variableSpeed) return typingSpeed;
        const { min, max } = variableSpeed;
        return Math.random() * (max - min) + min;
      }, [variableSpeed, typingSpeed]);

      const getCurrentTextColor = () => {
        if (textColors.length === 0) return 'inherit';
        return textColors[currentTextIndex % textColors.length];
      };

      useEffect(() => {
        if (!startOnVisible || !containerRef.current) return;

        const observer = new IntersectionObserver(
          entries => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                setIsVisible(true);
              }
            });
          },
          { threshold: 0.1 }
        );

        observer.observe(containerRef.current);
        return () => observer.disconnect();
      }, [startOnVisible]);

      useEffect(() => {
        if (showCursor && cursorRef.current) {
          gsap.set(cursorRef.current, { opacity: 1 });
          gsap.to(cursorRef.current, {
            opacity: 0,
            duration: cursorBlinkDuration,
            repeat: -1,
            yoyo: true,
            ease: 'power2.inOut'
          });
        }
      }, [showCursor, cursorBlinkDuration]);

      useEffect(() => {
        if (!isVisible) return;

        let timeout;
        const currentText = textArray[currentTextIndex];
        const processedText = reverseMode ? currentText.split('').reverse().join('') : currentText;

        const executeTypingAnimation = () => {
          if (isDeleting) {
            if (displayedText === '') {
              setIsDeleting(false);
              if (currentTextIndex === textArray.length - 1 && !loop) {
                return;
              }

              if (onSentenceComplete) {
                onSentenceComplete(textArray[currentTextIndex], currentTextIndex);
              }

              setCurrentTextIndex(prev => (prev + 1) % textArray.length);
              setCurrentCharIndex(0);
              timeout = setTimeout(() => {}, pauseDuration);
            } else {
              timeout = setTimeout(() => {
                setDisplayedText(prev => prev.slice(0, -1));
              }, deletingSpeed);
            }
          } else {
            if (currentCharIndex < processedText.length) {
              timeout = setTimeout(
                () => {
                  setDisplayedText(prev => prev + processedText[currentCharIndex]);
                  setCurrentCharIndex(prev => prev + 1);
                },
                variableSpeed ? getRandomSpeed() : typingSpeed
              );
            } else if (textArray.length >= 1) {
              if (!loop && currentTextIndex === textArray.length - 1) return;
              timeout = setTimeout(() => {
                setIsDeleting(true);
              }, pauseDuration);
            }
          }
        };

        if (currentCharIndex === 0 && !isDeleting && displayedText === '') {
          timeout = setTimeout(executeTypingAnimation, initialDelay);
        } else {
          executeTypingAnimation();
        }

        return () => clearTimeout(timeout);
      }, [
        currentCharIndex,
        displayedText,
        isDeleting,
        typingSpeed,
        deletingSpeed,
        pauseDuration,
        textArray,
        currentTextIndex,
        loop,
        initialDelay,
        isVisible,
        reverseMode,
        variableSpeed,
        onSentenceComplete,
        getRandomSpeed
      ]);

      const shouldHideCursor =
        hideCursorWhileTyping && (currentCharIndex < textArray[currentTextIndex].length || isDeleting);

      return (
        <Component
          ref={containerRef}
          className={`text-type ${className}`}
          {...props}
        >
          <span className="text-type__content" style={{ color: getCurrentTextColor() || 'inherit' }}>
            {displayedText}
          </span>
          {showCursor && (
            <span
              ref={cursorRef}
              className={`text-type__cursor ${cursorClassName} ${shouldHideCursor ? 'text-type__cursor--hidden' : ''}`}
            >
              {cursorCharacter}
            </span>
          )}
        </Component>
      );
    };

    function App() {
      const [stateData, setStateData] = useState(null);
      const [offline, setOffline] = useState(true);
      
      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const dataPoints = useRef({ time: [], psi: [], power: [] });

      // Dynamic Threat Tier Config
      let theme = 'cyanTheme';
      let themeColorHex = '#06b6d4';
      let accentGlow = 'rgba(6, 182, 212, 0.15)';
      let threatLevel = 0; // 0=Routine, 1=Warning, 2=Siege

      if (stateData) {
        if (stateData.siege_mode_active) { 
          theme = 'redTheme'; 
          themeColorHex = '#ef4444'; 
          accentGlow = 'rgba(239, 68, 68, 0.25)';
          threatLevel = 2;
        } else if (stateData.ssi < 0.5) { 
          theme = 'amberTheme'; 
          themeColorHex = '#d97706'; 
          accentGlow = 'rgba(217, 119, 6, 0.2)';
          threatLevel = 1;
        }
      }

      const getThemeClass = (type) => {
        if (type === 'text') return `text-${theme}`;
        if (type === 'border') return `border-${theme}`;
        if (type === 'bg') return `bg-${theme}`;
        return '';
      };

      // Poll state every 1.5 seconds
      useEffect(() => {
        const fetchData = async () => {
          try {
            const stateRes = await fetch('http://127.0.0.1:8080/state');
            if (stateRes.ok) {
              const state = await stateRes.json();
              setStateData(state);
              setOffline(false);
              updateChart(state);
            } else {
              setOffline(true);
            }
          } catch (error) {
            setOffline(true);
          }
        };

        fetchData();
        const interval = setInterval(fetchData, 1500);
        return () => clearInterval(interval);
      }, []);

      // High-Contrast Thicker Chart.js Initialization
      useEffect(() => {
        if (chartRef.current && !chartInstance.current) {
          const ctx = chartRef.current.getContext('2d');
          
          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: dataPoints.current.time,
              datasets: [
                { 
                  label: 'Water Flow Volume (PSI)', 
                  data: dataPoints.current.psi, 
                  borderColor: '#06b6d4', 
                  backgroundColor: 'rgba(6, 182, 212, 0.05)',
                  fill: true,
                  tension: 0.3, 
                  borderWidth: 4,
                  pointBackgroundColor: '#06b6d4',
                  pointBorderColor: '#ffffff',
                  pointBorderWidth: 1.5,
                  pointRadius: 4,
                  pointHoverRadius: 6
                },
                { 
                  label: 'Power Grid Load (%)', 
                  data: dataPoints.current.power, 
                  borderColor: '#f8fafc', 
                  borderDash: [6, 4], 
                  tension: 0.3, 
                  borderWidth: 2,
                  pointBackgroundColor: '#f8fafc',
                  pointRadius: 0
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: { duration: 500, easing: 'easeOutQuart' },
              scales: {
                x: { 
                  display: true, 
                  grid: { display: false },
                  ticks: { color: 'rgba(248, 250, 252, 0.45)', font: { size: 10, family: '"Share Tech Mono"' } }
                },
                y: { 
                  grid: { color: 'rgba(255, 255, 255, 0.05)', lineWidth: 1 }, 
                  ticks: { color: 'rgba(248, 250, 252, 0.6)', font: { size: 12, weight: 'bold', family: '"Share Tech Mono"' } },
                  min: 0, 
                  max: 100 
                }
              },
              plugins: { 
                legend: { 
                  position: 'top',
                  labels: { 
                    color: '#f8fafc', 
                    font: { size: 12, weight: '600', family: '"Plus Jakarta Sans"' },
                    boxWidth: 12,
                    boxHeight: 12,
                    padding: 15
                  } 
                }
              }
            }
          });
        }
      }, []);

      const updateChart = (state) => {
        if (!chartInstance.current) return;
        
        let cHex = '#06b6d4';
        let bgHex = 'rgba(6, 182, 212, 0.05)';
        
        if (state.siege_mode_active) {
          cHex = '#ef4444';
          bgHex = 'rgba(239, 68, 68, 0.08)';
        } else if (state.ssi < 0.5) {
          cHex = '#d97706';
          bgHex = 'rgba(217, 119, 6, 0.08)';
        }

        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const jitter = (Math.random() - 0.5) * 4;
        let newPsi = state.ssi * 100 + jitter;
        let newPower = state.ssi * 92 + jitter;
        
        if (state.ssi < 0.5) {
            newPsi = 28 + jitter;
            newPower = 32 + jitter;
        }

        const pts = dataPoints.current;
        pts.time.push(now);
        pts.psi.push(newPsi);
        pts.power.push(newPower);

        if (pts.time.length > 8) {
          pts.time.shift();
          pts.psi.shift();
          pts.power.shift();
        }

        chartInstance.current.data.datasets[0].borderColor = cHex;
        chartInstance.current.data.datasets[0].backgroundColor = bgHex;
        chartInstance.current.data.datasets[0].pointBackgroundColor = cHex;
        chartInstance.current.update();
      };

      const simulateBurst = async () => {
        try { await fetch('http://127.0.0.1:8080/api/override/alert', { method: 'POST' }); } catch (e) {}
      };
      const simulatePanic = async () => {
        try { 
            await fetch('http://127.0.0.1:8080/api/traffic/reroute', { method: 'POST' });
            await fetch('http://127.0.0.1:8080/api/grid/isolate', { method: 'POST' });
        } catch (e) {}
      };
      const triggerReset = async () => {
        try { await fetch('http://127.0.0.1:8080/api/override/lazarus', { method: 'POST' }); } catch (e) {}
      };

      if (offline || !stateData) {
        return (
          <div className="flex flex-col items-center justify-center h-full w-full bg-[#030712] text-center font-orbitron">
            <div className="relative flex items-center justify-center mb-6">
              <div className="w-16 h-16 border-4 border-cyan-500/20 border-t-cyan-500 rounded-full animate-spin"></div>
              <div className="absolute w-8 h-8 border-4 border-cyan-500/10 border-b-cyan-500 rounded-full animate-spin-reverse"></div>
            </div>
            <h1 className="text-3xl font-black text-slate-500 tracking-[0.2em]">AWAITING SYSTEMS LINK</h1>
            <p className="text-slate-600 mt-3 text-sm font-sans tracking-wide">CONNECTING TO GOVERNMENT CRISIS GATEWAY...</p>
          </div>
        );
      }

      const { ssi, social_signal, weather_condition } = stateData;
      const ssiDegree = Math.round(ssi * 360);
      const radialStyle = { background: `conic-gradient(${themeColorHex} ${ssiDegree}deg, rgba(31, 41, 55, 0.4) 0deg)` };

      // Highly accessible, smart glowing badge configs
      let systemStatusLabel = "🟢 ROUTINE / SECURE";
      let systemStatusStyle = "bg-emerald-950/60 border-emerald-500/60 text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.2)]";
      let panelThreatClass = "";
      
      if (threatLevel === 1) {
        systemStatusLabel = "🟡 WARNING UNDER REVIEW";
        systemStatusStyle = "bg-amber-950/60 border-amber-500/60 text-amber-400 shadow-[0_0_15px_rgba(217,119,6,0.25)]";
        panelThreatClass = "tech-panel-warning";
      } else if (threatLevel === 2) {
        systemStatusLabel = "🔴 CRITICAL LOCKDOWN";
        systemStatusStyle = "bg-red-950/65 border-red-500/70 text-red-400 shadow-[0_0_20px_rgba(239,68,68,0.35)] animate-pulse";
        panelThreatClass = "tech-panel-danger";
      }

      // Live city matrix badge colors
      const getSectorBadge = (sector) => {
          if (threatLevel === 0) return { label: "🟢 SAFE", color: "bg-emerald-950/50 border border-emerald-500/40 text-emerald-400" };
          if (threatLevel === 1) {
              if (sector === 'downtown' || sector === 'industrial') {
                return { label: "🟡 RISK WARNING", color: "bg-amber-950/50 border border-amber-500/50 text-amber-400 animate-pulse" };
              }
              return { label: "🟢 SAFE", color: "bg-emerald-950/50 border border-emerald-500/40 text-emerald-400" };
          }
          if (threatLevel === 2) {
              if (sector === 'downtown' || sector === 'industrial') {
                return { label: "🔴 LOCKED DOWN", color: "bg-red-950/60 border border-red-500/60 text-red-400 pulsate" };
              }
              if (sector === 'residential') return { label: "🟡 DEGRADED", color: "bg-amber-950/50 border border-amber-500/50 text-amber-400" };
              return { label: "🟢 SAFE (SHIELDED)", color: "bg-emerald-950/50 border border-emerald-500/60 text-emerald-400" };
          }
      };

      return (
        <div className="flex flex-col h-full w-full bg-transparent relative transition-colors duration-500 overflow-hidden">
          
          {/* Header Area */}
          <header className="w-full flex flex-col justify-center items-center border-b border-slate-800/80 z-10 bg-slate-950/70 backdrop-blur-md shadow-[0_4px_30px_rgba(0,0,0,0.4)] shrink-0">
            <div className="w-full max-w-[1800px] flex items-center justify-between p-5 px-10">
              
              {/* Pakistan Institutional Emblem & Dynamic Typing Title */}
              <div className="flex items-center">
                <svg className="mr-5 rounded-lg border border-slate-700/60 shadow-md shrink-0" width="60" height="40" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
                  <rect width="300" height="200" fill="#00501F" />
                  <rect width="75" height="200" fill="#FFFFFF" />
                  <circle cx="180" cy="100" r="45" fill="#FFFFFF" />
                  <circle cx="196" cy="84" r="45" fill="#00501F" />
                  <polygon points="180,68 184,77 194,77 186,83 189,92 180,86 171,92 174,83 166,77 176,77" fill="#FFFFFF" transform="rotate(-35 180 80)" />
                </svg>
                <div className="flex flex-col">
                  {/* Dynamic Typist Header Title from React Bits */}
                  <TextType 
                    as="span"
                    text={[
                      "NATIONAL URBAN CRISIS OBSERVATORY", 
                      "AETHER EMERGENCY ORCHESTRATOR", 
                      "SOVEREIGN TACTICAL CRITICAL DECK"
                    ]}
                    typingSpeed={65}
                    deletingSpeed={25}
                    pauseDuration={2500}
                    showCursor={true}
                    cursorCharacter="|"
                    cursorClassName="text-cyan-400/80 animate-pulse font-sans font-extrabold"
                    className="text-2xl font-black tracking-wider text-slate-100 font-orbitron uppercase bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent inline-block min-h-[36px]"
                  />
                  <span className="text-[10px] font-extrabold text-emerald-400/90 tracking-[0.25em] font-orbitron">
                    GOVERNMENT OF PAKISTAN — AETHER ORCHESTRATION ENGINE
                  </span>
                </div>
              </div>

              {/* Glowing Institutional Threat Level Badge */}
              <div className={`px-5 py-2.5 rounded-full border font-orbitron font-extrabold text-base tracking-widest shadow-lg ${systemStatusStyle}`}>
                {systemStatusLabel}
              </div>

            </div>
          </header>

          {/* Main Content Layout */}
          <main className="flex-1 w-full max-w-[1800px] mx-auto flex flex-row p-8 gap-8 z-10 min-h-0 pb-36">
            
            {/* COLUMN 1: Live Field Reports */}
            <section className={`flex-[0.8] flex flex-col tech-panel ${panelThreatClass} p-6 shadow-xl`}>
              <h2 className="text-lg font-bold font-orbitron tracking-wider mb-5 pb-3 border-b border-slate-800/80 text-slate-200 uppercase flex items-center justify-between">
                <span>📡 LIVE telemetry FEEDS</span>
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-500 animate-pulse"></span>
              </h2>
              <div className="flex-1 overflow-y-auto pr-1 space-y-6 font-sans">
                
                {/* Public Report Screen */}
                <div className="p-4 bg-slate-950/70 border border-slate-800/60 rounded-xl relative overflow-hidden group">
                  <div className="absolute top-0 right-0 w-24 h-24 bg-cyan-500/5 rounded-bl-full pointer-events-none group-hover:bg-cyan-500/10 transition-colors"></div>
                  <span className="text-[10px] font-bold text-cyan-400 font-orbitron tracking-[0.2em] block mb-2">PUBLIC REPORT FEED</span>
                  <p className="text-sm font-medium text-slate-300 leading-relaxed font-sans">{social_signal}</p>
                </div>
                
                {/* Grid Sensor Screen */}
                <div className="p-4 bg-slate-950/70 border border-slate-800/60 rounded-xl relative overflow-hidden group">
                  <div className="absolute top-0 right-0 w-24 h-24 bg-cyan-500/5 rounded-bl-full pointer-events-none group-hover:bg-cyan-500/10 transition-colors"></div>
                  <span className="text-[10px] font-bold text-cyan-400 font-orbitron tracking-[0.2em] block mb-2">INFRASTRUCTURE SENSORS</span>
                  <p className="text-sm font-medium text-slate-300 leading-relaxed font-sans">{weather_condition}</p>
                </div>

              </div>
            </section> 

            {/* COLUMN 2: Tactical Vital Signs & Dynamic Chart */}
            <section className={`flex-[1.8] flex flex-col tech-panel ${panelThreatClass} p-6 shadow-xl`}>
              <h2 className="text-lg font-bold font-orbitron tracking-wider mb-5 pb-3 border-b border-slate-800/80 text-slate-200 uppercase flex items-center justify-between">
                <span>📊 CRITICAL DECISION DECK</span>
                <span className="font-tech text-xs tracking-widest text-slate-500">SYSTEM: ONLINE</span>
              </h2>
              
              <div className="flex flex-row flex-1 mt-2 gap-8 items-center justify-center h-full min-h-0">
                
                {/* Tactical Safety Index Meter */}
                <div className="flex flex-col items-center justify-center shrink-0">
                  <div className="radial-progress" style={radialStyle}>
                    <div className="radial-content flex flex-col items-center">
                      <span className="text-5xl font-black text-white font-tech tracking-tighter drop-shadow-md">
                        {Math.round(ssi * 100)}%
                      </span>
                      <span className="text-[9px] font-bold tracking-[0.15em] mt-2 text-slate-400 font-orbitron uppercase max-w-[130px] leading-tight">
                        SOVEREIGN SECURITY INDEX
                      </span>
                    </div>
                  </div>
                  
                  <div className="mt-6 text-center">
                    <span className="text-[9px] font-bold tracking-[0.25em] text-slate-500 font-orbitron uppercase block mb-1">
                      ORCHESTRATION GATE STATUS
                    </span>
                    <span className={`text-xs font-bold font-orbitron tracking-wider uppercase block ${
                      threatLevel === 2 ? 'text-red-400' : threatLevel === 1 ? 'text-amber-400' : 'text-cyan-400'
                    }`}>
                      {threatLevel === 0 && "DECISION GROUP VOTE: STABLE"}
                      {threatLevel === 1 && "DECISION GROUP VOTE: VOTE DISCREPANCY"}
                      {threatLevel === 2 && "DECISION GROUP VOTE: EMERGENCY LOCKDOWN ACTIVE"}
                    </span>
                  </div>
                </div>
                
                {/* Advanced Operations Chart */}
                <div className="flex-1 h-full min-h-[260px] bg-slate-950/60 rounded-xl border border-slate-800/60 p-4 relative flex flex-col">
                  
                  {/* Operations Status Overlay Tag */}
                  <div className="absolute top-4 right-4 bg-emerald-950/80 border border-emerald-500/50 text-emerald-400 text-[10px] font-bold font-orbitron px-3 py-1 rounded-full z-20 shadow-md">
                    ✓ SECURE TELEMETRY FEED ACTIVE
                  </div>
                  
                  <div className="flex-1 min-h-0 relative">
                    <canvas ref={chartRef} className="relative z-10"></canvas>
                  </div>
                </div>

              </div>
            </section>

            {/* COLUMN 3: Tactical Grid Sectors */}
            <section className={`flex-[1.2] flex flex-col tech-panel ${panelThreatClass} p-6 shadow-xl`}>
              <h2 className="text-lg font-bold font-orbitron tracking-wider mb-5 pb-3 border-b border-slate-800/80 text-slate-200 uppercase">
                🎯 PREDICTIVE GRID MAP
              </h2>
              
              <div className="flex-1 grid grid-cols-2 gap-4 font-orbitron mt-2">
                  
                  {/* Downtown Sector */}
                  <div className="bg-slate-950/40 border border-slate-800/60 p-5 rounded-xl flex flex-col items-center justify-center relative hover:bg-slate-950/85 hover:border-slate-700/60 transition-all duration-300 group">
                      <div className="absolute top-2 left-2 text-[8px] text-slate-600 font-tech">SECTOR-01</div>
                      <span className="font-bold text-sm text-slate-300 mb-3 tracking-widest text-center">DOWNTOWN</span>
                      <span className={`px-4 py-1.5 rounded-full font-extrabold text-[10px] tracking-wider ${getSectorBadge('downtown').color}`}>
                          {getSectorBadge('downtown').label}
                      </span>
                  </div>
                  
                  {/* Industrial Zone Sector */}
                  <div className="bg-slate-950/40 border border-slate-800/60 p-5 rounded-xl flex flex-col items-center justify-center relative hover:bg-slate-950/85 hover:border-slate-700/60 transition-all duration-300 group">
                      <div className="absolute top-2 left-2 text-[8px] text-slate-600 font-tech">SECTOR-02</div>
                      <span className="font-bold text-sm text-slate-300 mb-3 tracking-widest text-center">INDUSTRIAL</span>
                      <span className={`px-4 py-1.5 rounded-full font-extrabold text-[10px] tracking-wider ${getSectorBadge('industrial').color}`}>
                          {getSectorBadge('industrial').label}
                      </span>
                  </div>
                  
                  {/* Residential Hub Sector */}
                  <div className="bg-slate-950/40 border border-slate-800/60 p-5 rounded-xl flex flex-col items-center justify-center relative hover:bg-slate-950/85 hover:border-slate-700/60 transition-all duration-300 group">
                      <div className="absolute top-2 left-2 text-[8px] text-slate-600 font-tech">SECTOR-03</div>
                      <span className="font-bold text-sm text-slate-300 mb-3 tracking-widest text-center">RESIDENTIAL</span>
                      <span className={`px-4 py-1.5 rounded-full font-extrabold text-[10px] tracking-wider ${getSectorBadge('residential').color}`}>
                          {getSectorBadge('residential').label}
                      </span>
                  </div>
                  
                  {/* Hospital District Sector */}
                  <div className="bg-slate-950/40 border border-slate-800/60 p-5 rounded-xl flex flex-col items-center justify-center relative hover:bg-slate-950/85 hover:border-slate-700/60 transition-all duration-300 group">
                      <div className="absolute top-2 left-2 text-[8px] text-slate-600 font-tech">SECTOR-04</div>
                      <span className="font-bold text-sm text-slate-300 mb-3 tracking-widest text-center">HOSPITAL DIS.</span>
                      <span className={`px-4 py-1.5 rounded-full font-extrabold text-[10px] tracking-wider ${getSectorBadge('hospital').color}`}>
                          {getSectorBadge('hospital').label}
                      </span>
                  </div>

              </div>
            </section>
          </main>

          {/* Dynamic Crisis Simulation Console Panel */}
          <section className="absolute bottom-0 left-0 right-0 h-32 border-t border-slate-800/80 bg-slate-950/90 backdrop-blur-md p-5 flex flex-col items-center justify-center z-50 shadow-[0_-12px_40px_rgba(0,0,0,0.5)]">
             <h3 className="text-slate-500 font-black text-xs tracking-[0.25em] font-orbitron uppercase mb-3.5">
               TACTILE SIMULATION CONTROL DESK
             </h3>
             <div className="flex gap-8">
                <button onClick={simulateBurst} className="px-6 py-3 bg-red-950/45 hover:bg-red-600 text-red-400 hover:text-black border border-red-500/50 hover:border-red-400 font-orbitron font-black text-xs tracking-widest rounded-xl transition-all duration-300 hover:shadow-[0_0_20px_rgba(239,68,68,0.45)] transform hover:-translate-y-0.5 active:translate-y-0">
                    🔴 INITIATE WATER BURST
                </button>
                <button onClick={simulatePanic} className="px-6 py-3 bg-amber-950/45 hover:bg-amber-500 text-amber-400 hover:text-black border border-amber-500/50 hover:border-amber-400 font-orbitron font-black text-xs tracking-widest rounded-xl transition-all duration-300 hover:shadow-[0_0_20px_rgba(217,119,6,0.45)] transform hover:-translate-y-0.5 active:translate-y-0">
                    🟡 TRIGGER SOCIAL PANIC
                </button>
                <button onClick={triggerReset} className="px-6 py-3 bg-emerald-950/45 hover:bg-emerald-500 text-emerald-400 hover:text-black border border-emerald-500/50 hover:border-emerald-400 font-orbitron font-black text-xs tracking-widest rounded-xl transition-all duration-300 hover:shadow-[0_0_20px_rgba(16,185,129,0.45)] transform hover:-translate-y-0.5 active:translate-y-0">
                    💚 DEPLOY LAZARUS RESET
                </button>
             </div>
          </section>
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
